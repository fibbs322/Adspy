<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AdSpy — трекер рекламных креативов Facebook</title>
<link rel="stylesheet" href="/css/style.css" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <header class="topbar">
    <div class="brand">🔍 AdSpy</div>
    <nav id="nav" class="nav"></nav>
  </header>

  <!-- Экран авторизации -->
  <section id="auth-view" class="view">
    <div class="auth-card">
      <div class="tabs">
        <button class="tab-btn active" data-tab="login">Вход</button>
        <button class="tab-btn" data-tab="register">Регистрация</button>
      </div>

      <div id="google-signin-box" class="google-signin-box hidden">
        <div id="google-signin-button"></div>
        <div class="divider"><span>или</span></div>
      </div>

      <form id="login-form" class="auth-form">
        <label>Email<input type="email" name="email" required /></label>
        <label>Пароль
          <span class="password-field">
            <input type="password" name="password" required />
            <button type="button" class="toggle-eye" aria-label="Показать пароль">👁</button>
          </span>
        </label>
        <button type="submit">Войти</button>
        <p class="error" id="login-error"></p>
      </form>

      <form id="register-form" class="auth-form hidden">
        <label>Email<input type="email" name="email" required /></label>
        <label>Пароль (мин. 8 символов)
          <span class="password-field">
            <input type="password" name="password" required minlength="8" />
            <button type="button" class="toggle-eye" aria-label="Показать пароль">👁</button>
          </span>
        </label>
        <label>Повторите пароль
          <span class="password-field">
            <input type="password" name="password2" required minlength="8" />
            <button type="button" class="toggle-eye" aria-label="Показать пароль">👁</button>
          </span>
        </label>
        <button type="submit">Создать аккаунт</button>
        <p class="error" id="register-error"></p>
      </form>

      <form id="verify-form" class="auth-form hidden">
        <p class="verify-hint">Мы отправили код подтверждения на <b id="verify-email-label"></b>. Введите его ниже.</p>
        <label>Код из письма<input type="text" name="code" inputmode="numeric" maxlength="6" required /></label>
        <button type="submit">Подтвердить</button>
        <button type="button" id="resend-code-btn" class="link-btn">Отправить код ещё раз</button>
        <p class="error" id="verify-error"></p>
      </form>
    </div>
  </section>

  <!-- Основной экран -->
  <section id="dashboard-view" class="view hidden">
    <aside class="sidebar">
      <h3>Сохранённые поиски</h3>
      <ul id="saved-list" class="saved-list"></ul>
      <h3>Избранное</h3>
      <ul id="fav-list" class="saved-list"></ul>
    </aside>

    <main class="main">
      <form id="search-form" class="search-bar">
        <input type="text" id="search-q" placeholder="Название бренда, страницы или ключевое слово…" required />
        <select id="search-country">
          <option value="US">США</option>
          <option value="UA">Украина</option>
          <option value="PL">Польша</option>
          <option value="DE">Германия</option>
          <option value="GB">Великобритания</option>
          <option value="ALL">Все страны</option>
        </select>
        <label class="checkbox-label">
          <input type="checkbox" id="search-active" checked /> только активные
        </label>
        <button type="submit">Найти</button>
        <button type="button" id="save-search-btn">💾 Сохранить поиск</button>
      </form>

      <div id="search-meta" class="search-meta"></div>
      <div id="results" class="results-grid"></div>
    </main>
  </section>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
